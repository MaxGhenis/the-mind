name: Benchmark validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check themind tests
      - run: ruff format --check themind tests
      - run: pytest
      - name: Validate offline control suite
        run: |
          python -m themind run --suite experiments/baselines.json --out runs/ci
          python -c "import json; s=json.load(open('runs/ci/summary.json')); assert all(s['conditions'][n]['completion_rate_all_attempts'] == 1 for n in ('shared', 'shared_fast', 'shared_feedback'))"
